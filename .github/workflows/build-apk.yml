name: Build APK

# Сборка APK в облаке — на компьютере пользователя ничего не требуется.
# Модель не хранится в git: сборщик скачивает её напрямую с Hugging Face
# (это просто файл, не облачный API) и проверяет SHA-256.
#
# Сборка идёт в официальным Docker-образе kivy/buildozer: там зафиксирована
# проверенная цепочка инструментов (autoconf/libtool/gcc), иначе на свежих
# ubuntu-latest падает рецепт libffi (LT_SYS_SYMBOL_USCORE при autoreconf).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Скачивание модели Qwen2.5-0.5B (491 МБ)
        run: |
          curl -L --retry 3 --retry-delay 5 -o qwen2.5-0.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  qwen2.5-0.5b-instruct-q4_k_m.gguf" | sha256sum -c -

      - name: Сборка APK (20-40 минут)
        run: buildozer android debug

      - name: Готовый APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: qwenchat-apk
          path: bin/*.apk
          if-no-files-found: error
